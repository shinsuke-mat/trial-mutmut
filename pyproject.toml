[project]
name = "trial-mutmut"
version = "0.1.0"
description = ""
authors = [
    {name = "shinsuke-mat",email = "shinsuke-mat@users.noreply.github.com"}
]
requires-python = ">=3.13"
dependencies = [
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
norecursedirs = ["mutants"]

[tool.mutmut]
paths_to_mutate = [ "src/" ]
pytest_add_cli_args_test_selection= [ "tests/" ]

[dependency-groups]
dev = [
    "mutmut>=3.6.0",
    "pytest>=9.1.0",
]
# debug=true  # show all generated mutants and test results
